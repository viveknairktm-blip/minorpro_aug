<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather | ExploreHub</title><link rel="stylesheet" href="weather.css">
  <script src="weather.js" type="module" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span> ExploreHub</a><a class="back-link" href="index.html">← Home</a></header>
  <main class="page">
    <div class="page-heading"><p class="eyebrow">LIVE WEATHER</p><h1>Weather around you.</h1><p>Search any city to see its current weather conditions.</p></div>
    <form id="weather-form" class="search-form">
      <label class="sr-only" for="city-input">City name</label><input id="city-input" type="text" placeholder="Enter a city (e.g. Kochi)" required>
      <button type="submit">Search weather</button>
    </form>
    <p id="weather-message" class="message" role="status">Enter a city name to get started.</p>
    <section id="weather-result" class="weather-panel hidden" aria-live="polite">
      <div class="weather-main"><div><p id="weather-city" class="city"></p><p id="weather-description" class="description"></p></div><div class="temperature"><span id="weather-icon">🌤️</span><strong id="temperature">--°</strong></div></div>
      <div class="weather-stats">
        <div class="stat"><span>💧</span><small>HUMIDITY</small><strong id="humidity">--%</strong></div>
        <div class="stat"><span>💨</span><small>WIND SPEED</small><strong id="wind">-- m/s</strong></div>
        <div class="stat"><span>🌡️</span><small>FEELS LIKE</small><strong id="feels">--°</strong></div>
      </div>
    </section>
    <p class="api-note">Weather data provided by OpenWeather. Add your free API key in <code>weather.js</code>.</p>
  </main>
</body>
</html>
