<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Search | ExploreHub</title><link rel="stylesheet" href="movies.css">
  <script src="movies.js" type="module" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span> ExploreHub</a><a class="back-link" href="index.html">← Home</a></header>
  <main class="page">
    <section class="page-heading"><p class="eyebrow">MOVIE DISCOVERY</p><h1>Find your next favourite.</h1><p>Search for a movie and explore its details.</p></section>
    <form id="movie-form" class="search-form"><label class="sr-only" for="movie-input">Movie title</label><input id="movie-input" type="search" placeholder="Search a movie (e.g. Inception)" required><button type="submit">Search movies</button></form>
    <p id="movie-message" class="message" role="status">Try searching for a movie title.</p>
    <section id="movie-results" class="movie-grid" aria-live="polite"></section>
    <p class="api-note">Movie data provided by OMDb. Add your free API key in <code>movies.js</code>.</p>
  </main>
</body>
</html>
